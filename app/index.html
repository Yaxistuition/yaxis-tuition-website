const cfg={apiKey:"AIzaSyBbXwXd4lZh4iRUH2UGYWVpunrGOEt89JA",authDomain:"yaxis-tuition-ac94f.firebaseapp.com",projectId:"yaxis-tuition-ac94f",storageBucket:"yaxis-tuition-ac94f.firebasestorage.app",messagingSenderId:"1005729199924",appId:"1:1005729199924:web:16a9ea9403fa30fe649761"};

 if(c.includes('invalid-credential')||c.includes('wrong-password')||c.includes('user-not-found'))return T('Wrong mobile number or PIN.','மொபைல் எண் அல்லது PIN தவறு.');
 if(c.includes('too-many-requests'))return T('Too many attempts. Wait a few minutes and try again.','பலமுறை முயன்றுவிட்டீர்கள். சில நிமிடம் காத்திருந்து மீண்டும் முயலவும்.');
 if(c.includes('network'))return T('No internet connection.','இணைய இணைப்பு இல்லை.');

 if(c.includes('permission-denied'))return T('Not allowed (permission denied).','அனுமதி இல்லை.');
 return T('Error: ','பிழை: ')+(c||e&&e.message||'');}

async function ownerExists(){try{return (await getDoc(doc(fs,'meta','owner'))).exists()}catch(e){return null}}

 $('go').onclick=doLogin;$('pn').onkeydown=e=>{if(e.key==='Enter')doLogin()};

 if(ex===false)$('setup').innerHTML=`<div class="card"><h2>${T('First-time setup','முதல் முறை அமைப்பு')}</h2><p class="mut">${T('The owner account is not created yet.','உரிமையாளர் கணக்கு இன்னும் உருவாக்கப்படவில்லை.')}</p><button class="btn gr" onclick="window.YX.setup()">${T('Set up owner account','உரிமையாளர் கணக்கை உருவாக்கு')}</button></div>`;

async function doLogin(){
 if(busy)return;const ph=$('ph').value.trim(),pn=$('pn').value.trim();
 if(!okPhone(ph))return msg(T('Enter a valid 10-digit mobile number.','சரியான 10 இலக்க மொபைல் எண்ணை உள்ளிடவும்.'));
 if(!okPin(pn))return msg(T('PIN must be 4 to 6 digits.','PIN 4 முதல் 6 இலக்கம் இருக்க வேண்டும்.'));
 busy=true;$('go').disabled=true;msg('');
 try{
  // try newest account first (after PIN resets the email gets a .vN suffix)
  let cred=null,last=null;
  for(const v of [1,2,3]){
   try{cred=await signInWithEmailAndPassword(auth,mail(ph,v),pass(pn));break}catch(e){last=e;if(!(e.code||'').includes('invalid-credential')&&!(e.code||'').includes('user-not-found'))break}
  }
  if(!cred)throw last;
 }catch(e){msg(errText(e));busy=false;$('go').disabled=false;return}
 busy=false;ME=null;route();
}
async function viewSetup(){
 $('app').innerHTML=shell(`<div class="card"><h2>${T('Create owner account','உரிமையாளர் கணக்கு')}</h2>
 <p class="mut">${T('Mobile number is fixed to the centre number. Choose a 6-digit PIN and remember it.','மொபைல் எண் மையத்தின் எண்ணாக நிலையானது. 6 இலக்க PIN தேர்ந்தெடுத்து நினைவில் வையுங்கள்.')}</p>
 <label>${T('Mobile number','மொபைல் எண்')}</label><input id="ph" value="${OWNER_PHONE}" disabled>
 <label>${T('New 6-digit PIN','புதிய 6 இலக்க PIN')}</label><input id="pn" type="password" inputmode="numeric" maxlength="6">
 <label>${T('Repeat PIN','PIN மீண்டும்')}</label><input id="pn2" type="password" inputmode="numeric" maxlength="6">
 <div id="m"></div><button class="btn" id="go">${T('Create','உருவாக்கு')}</button><button class="btn gr" onclick="window.YX.route()">${T('Back','பின்')}</button></div>`);
 $('go').onclick=async()=>{
  const a=$('pn').value.trim(),b=$('pn2').value.trim();
  if(!/^\d{6}$/.test(a))return msg(T('Owner PIN must be exactly 6 digits.','உரிமையாளர் PIN சரியாக 6 இலக்கம்.'));
  if(a!==b)return msg(T('The two PINs do not match.','இரு PIN-களும் பொருந்தவில்லை.'));
  if(await ownerExists()!==false)return msg(T('Owner already exists.','உரிமையாளர் ஏற்கெனவே உள்ளார்.'));
  $('go').disabled=true;busy=true;
  try{
   const c=await createUserWithEmailAndPassword(auth,mail(OWNER_PHONE,1),pass(a));
   const b2=writeBatch(fs);
   b2.set(doc(fs,'meta','owner'),{uid:c.user.uid,at:serverTimestamp()});
   b2.set(doc(fs,'users',c.user.uid),{role:'owner',name:'C. Manimegalai',phone:OWNER_PHONE,active:true,v:1,at:serverTimestamp()});
   await b2.commit();
  }catch(e){msg(errText(e));$('go').disabled=false;busy=false;return}
  busy=false;ME=null;route();
 };
}

 return [['home','🏠',T('Home','முகப்பு')],['sa','🕘',T('My Attendance','என் வருகை')],['att','🗓️',T('Student Attendance','மாணவர் வருகை')],['stu','🎓',T('Student Entry','மாணவர் பதிவு')],['lv','🌴',T('Leave','விடுப்பு')],['ex','📈',T('Progress','முன்னேற்றம்')],['pgrid','📊',T('Progress Reports','முன்னேற்ற அறிக்கைகள்')]];
}
const mainKeys=()=>ME.role==='owner'?['home','att','cal','lv','pay']:ME.role==='teacher'?['home','sa','stu','pgrid','lv']:['home','alerts'];
function side(){const it=navItems();if(it.length<2)return '';return `<nav class="side"><div class="logo2"><img src="/assets/images/logo.png" alt="Y Axis Tuition"></div>${it.map(x=>`<button class="${x[0]===TAB?'on':''}" onclick="window.YX.tab('${x[0]}')">${x[1]} ${x[2]}</button>`).join('')}</nav>`}

  for(const s of STU){

   ${exHtml(s)}${feeHtml(s)}<h2 style="margin-top:12px">${T('Attendance report','வருகை அறிக்கை')}</h2>
   ${rec.slice(0,31).map(x=>`<div class="row"><b>${fmtD(x.date)}</b>${stTag(x)}</div>`).join('')||`<p class="mut">${T('No records yet.','பதிவுகள் இல்லை.')}</p>`}</div>`;
  }
 }

async function mkUser(ph,name,role,v){
 // secondary app instance so the owner stays signed in
 const sec=initializeApp(cfg,'sec'+Date.now()),sa=getAuth(sec);
 const pin=String(Math.floor(100000+Math.random()*900000));
 try{
  const c=await createUserWithEmailAndPassword(sa,mail(ph,v),pass(pin));
  await setDoc(doc(fs,'users',c.user.uid),{role,name,phone:ph,active:true,v,at:serverTimestamp()});
  return pin;
 }finally{try{await signOut(sa)}catch(e){}}

const MNT=['','ஜனவரி','பிப்ரவரி','மார்ச்','ஏப்ரல்','மே','ஜூன்','ஜூலை','ஆகஸ்ட்','செப்டம்பர்','அக்டோபர்','நவம்பர்','டிசம்பர்'],MNE=['','Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const mLab=m=>{const [y,mm]=m.split('-');return (L==='ta'?MNT:MNE)[+mm]+' '+y};
const dim=m=>{const [y,mm]=m.split('-').map(Number);return new Date(y,mm,0).getDate()};

 try{const q=await getDocs(collection(fs,'users'));TCH=[];q.forEach(d=>{const x=d.data();if(x.role==='teacher'&&x.active!==false)TCH.push({uid:d.id,name:x.name||'',phone:x.phone||''})});TCH.sort((a,b)=>a.name.localeCompare(b.name))}catch(e){TCH=[]}

function wdays(m){const r=[];for(let i=1;i<=dim(m);i++){const d=m+'-'+pad(i);if(HOL.some(h=>h.date===d))continue;if(SET.sun==='holiday'&&dow(d)===0)continue;r.push(d)}return r}
const paidIn=(uid,m)=>LV.filter(l=>l.uid===uid&&l.status==='approved'&&l.type==='paid'&&l.date.startsWith(m)).length;
function payCalc(t,m){
 const sal=SAL[t.uid]||0,wd=wdays(m),up=mEnd(m)<today()?mEnd(m):today(),past=wd.filter(d=>d<=up);
 const pres=new Set(SATM.filter(x=>x.uid===t.uid&&x.date.startsWith(m)).map(x=>x.date));
 const lvd={};LV.filter(l=>l.uid===t.uid&&l.status==='approved'&&l.date.startsWith(m)).forEach(l=>lvd[l.date]=l.type);
 const present=past.filter(d=>pres.has(d)).length;
 const pl=past.filter(d=>!pres.has(d)&&lvd[d]==='paid').length,ul=past.filter(d=>!pres.has(d)&&lvd[d]==='unpaid').length;
 const ua=past.filter(d=>!pres.has(d)&&!lvd[d]).length;
 const div=SET.method==='cal'?wd.length:SET.method==='custom'?(+SET.div||26):(+SET.method||26);
 const daily=div?sal/div:0,dedU=Math.round(daily*ul),dedA=Math.round(daily*ua),ded=Math.min(sal,dedU+dedA);
 return {sal,div,hol:dim(m)-wd.length,daily,present,pl,ul,ua,dedU,dedA,ded,pay:Math.max(0,Math.round(sal-ded)),rows:past.map(d=>({d,e:SATM.find(x=>x.uid===t.uid&&x.date===d),st:pres.has(d)?'P':lvd[d]==='paid'?'PL':lvd[d]==='unpaid'?'UL':'A'}))};
}

async function dlX(sheets,name){
 try{await loadScript('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js');const wb=XLSX.utils.book_new();sheets.forEach(s=>XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(s.rows),s.name.slice(0,31)));XLSX.writeFile(wb,name+'.xlsx');return}catch(e){}
 const cl=c=>{let v=String(c==null?'':c);if(/^[=+\-@]/.test(v))v="'"+v;return '"'+v.replace(/"/g,'""')+'"'};
 const csv=sheets.map(s=>s.name+'\n'+s.rows.map(r=>r.map(cl).join(',')).join('\n')).join('\n\n');
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv'}));a.download=name+'.csv';document.body.appendChild(a);a.click();a.remove()}

async function repData(m){
 await loadStu();await prep(m);
 const q=await getDocs(query(collection(fs,'att'),where('date','>=',m+'-01'),where('date','<=',m+'-31')));const A=[];q.forEach(d=>A.push(d.data()));

 TCH.forEach(t=>{const r=payCalc(t,m);pay.push([t.name,t.phone,r.sal,r.div,r.present,r.pl,r.ul,r.ua,r.ded,r.pay])});

async function stOut2(list){

 try{const t=nowHM();let n=0;
  for(const s of act){const a=ATT[s.id];let rec=null;
   if(!a)rec={sid:s.id,date:today(),parentPhone:s.parentPhone,by:ME.name,st:'A',in:null,out:null};
   else if(a.st==='P'&&!a.out)rec={...a,out:t};

}

/* ---- stage 14: Progress module: class grid -> students -> student page ---- */
const PG={c:'',sid:'',tab:'prog',pm:'',am:'',pt:'m',tf:null,msg:'',ed:false};
let PD={marks:[],att:[],rm:{}},MGK=[],MGV={};
const SUBJ=c=>{const n=+c;return n<=5?['Tamil','English','Maths','EVS']:n<=10?['Tamil','English','Maths','Science','Social Science']:['Tamil','English','Maths','Physics','Chemistry','Biology','Computer Science','Accountancy','Commerce','Economics','History','Business Maths']};
const ALLS=['Tamil','English','Maths','EVS','Science','Social Science','Physics','Chemistry','Biology','Computer Science','Accountancy','Commerce','Economics','History','Business Maths'];
const SNM={Tamil:'தமிழ்',English:'ஆங்கிலம்',Maths:'கணிதம்',EVS:'சுற்றுச்சூழலியல்',Science:'அறிவியல்','Social Science':'சமூக அறிவியல்',Physics:'இயற்பியல்',Chemistry:'வேதியியல்',Biology:'உயிரியல்','Computer Science':'கணினி அறிவியல்',Accountancy:'கணக்குப்பதிவியல்',Commerce:'வணிகவியல்',Economics:'பொருளியல்',History:'வரலாறு','Business Maths':'வணிகக் கணிதம்'};
const subN=z=>SNM[z]?T(z,SNM[z]):z;
const pcn=x=>x.m*100/x.max,avg=a=>a.reduce((p,c)=>p+c,0)/a.length,rnd=x=>Math.round(x);
const pAddD=(d,k)=>{const x=new Date(d+'T12:00:00');x.setDate(x.getDate()+k);return x.toLocaleDateString('en-CA')};
const fdy=d=>{const [y,m,dd]=d.split('-');return (+dd)+' '+(L==='ta'?MNT:MNE)[+m]+' '+y};
const joinD=s=>{try{return s.join||(s.at&&s.at.toDate?s.at.toDate().toLocaleDateString('en-CA',{timeZone:'Asia/Kolkata'}):today())}catch(e){return today()}};
const barC=a=>a==null?'#999':a>=75?'#1B8F1E':a>=50?'#f2a900':'#d64545';
const SCL=['#2a5bd7','#d64545','#1B8F1E','#f2a900','#8a4fd0','#0fa3b1','#e07b39','#6b7280','#b83280','#2f855a','#b7791f','#4a5568','#7c3aed','#0e7490','#be123c'];
const scol=n=>SCL[Math.max(0,ALLS.indexOf(n))%SCL.length];
const avt2=(s,z)=>s.photo?`<img class="av2" style="width:${z}px;height:${z}px;object-fit:cover" src="${esc(s.photo)}" alt="">`:`<span class="av2" style="width:${z}px;height:${z}px;font-size:${Math.round(z*.42)}px">${esc((s.name||'?').trim().charAt(0).toUpperCase())}</span>`;
function shrinkImg(f,max,q){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',q))};im.onerror=rej;im.src=fr.result};fr.onerror=rej;fr.readAsDataURL(f)})}
async function pgLoad(s){
 const par=ME.role==='parent';PD={marks:[],att:[],rm:{}};
 try{const q=par?query(collection(fs,'marks'),where('parentPhone','==',ME.phone),where('pub','==',true)):query(collection(fs,'marks'),where('sid','==',s.id));(await getDocs(q)).forEach(d=>{const x=d.data();if(x.sid===s.id)PD.marks.push({id:d.id,...x})})}catch(e){}
 try{const q=par?query(collection(fs,'att'),where('parentPhone','==',ME.phone)):query(collection(fs,'att'),where('sid','==',s.id));(await getDocs(q)).forEach(d=>{const x=d.data();if(x.sid===s.id)PD.att.push(x)})}catch(e){}
 try{const q=par?query(collection(fs,'remarks'),where('parentPhone','==',ME.phone)):query(collection(fs,'remarks'),where('sid','==',s.id));(await getDocs(q)).forEach(d=>{const x=d.data();if(x.sid===s.id)PD.rm[x.pm]=x})}catch(e){}
 PD.marks.forEach(x=>{if(x.subject&&!ALLS.includes(x.subject))ALLS.push(x.subject)});
}
const attS=(s,from,to)=>{const r=PD.att.filter(x=>x.date>=from&&x.date<=to);const p=r.filter(x=>x.st==='P').length,a=r.filter(x=>x.st==='A').length;return {p,a,cd:p+a,pct:p+a?rnd(p*100/(p+a)):null}};
function pData(s,pm){
 const t0=today(),j=joinD(s);let from,to,label;
 if(pm==='all'){from=j;to=t0;label=T('Overall — since joining','ஓவரால் — சேர்ந்தது முதல்')}
 else{from=pm+'-01';to=mEnd(pm)<t0?mEnd(pm):t0;if(from<j)from=j;label=mLab(pm)}
 const tests=PD.marks.filter(x=>!x.ab&&x.m!=null&&x.date>=from&&x.date<=to);
 const subs=ALLS.filter(z=>tests.some(y=>y.subject===z)).map(z=>{const a=tests.filter(y=>y.subject===z).map(pcn);return {sub:z,avg:avg(a),n:a.length}});
 return {from,to,label,tests,subs,overall:subs.length?avg(subs.map(x=>x.avg)):null,att:attS(s,from,to)};
}
function monthlyS(from,to){
 const ms=[];let m=from.slice(0,7);const e=to.slice(0,7);while(m<=e){ms.push(m);m=addM(m,1)}
 const tt=PD.marks.filter(x=>!x.ab&&x.m!=null&&x.date>=from&&x.date<=to);
 return {labels:ms.map(mLab),series:ALLS.filter(z=>tt.some(y=>y.subject===z)).map(z=>({name:z,pts:ms.map(m=>{const a=tt.filter(x=>x.subject===z&&x.date.startsWith(m));return a.length?avg(a.map(pcn)):null})}))};
}
function barsH(subs){
 if(!subs.length)return `<p class="mut">${T('No test marks in this period. Subjects without marks are not counted.','இந்தக் காலத்தில் மதிப்பெண்கள் இல்லை. மதிப்பெண் இல்லாத பாடங்கள் கணக்கில் சேராது.')}</p>`;
 return `<div class="bars">`+subs.map(x=>`<div class="br"><span class="bl">${esc(subN(x.sub))}</span><span class="bt"><i style="width:${Math.max(3,rnd(x.avg))}%;background:${barC(x.avg)}"></i></span><b style="color:${barC(x.avg)}">${rnd(x.avg)}%</b></div>`).join('')+`</div>`;
}
function chartH(labels,series){
 const W=340,Hh=190,Lm=30,R=8,Tp=10,B=26,w=W-Lm-R,h=Hh-Tp-B,n=labels.length;
 const X=i=>Lm+(n<2?w/2:i*w/(n-1)),Y=v=>Tp+h-(v/100)*h;
 let s=`<svg viewBox="0 0 ${W} ${Hh}" role="img" style="width:100%">`;
 [0,25,50,75,100].forEach(g=>{s+=`<line x1="${Lm}" x2="${W-R}" y1="${Y(g)}" y2="${Y(g)}" stroke="#e1e6f0"/><text x="${Lm-4}" y="${Y(g)+3}" font-size="9" text-anchor="end" fill="#6a748a">${g}%</text>`});
 labels.forEach((l,i)=>{s+=`<text x="${X(i)}" y="${Hh-8}" font-size="9" text-anchor="${i===n-1&&n>1?'end':i===0&&n>1?'start':'middle'}" fill="#6a748a">${esc(l)}</text>`});
 series.forEach(se=>{const c=scol(se.name);const pts=se.pts.map((v,i)=>v==null?null:[X(i),Y(v)]).filter(Boolean);if(pts.length>1)s+=`<polyline fill="none" stroke="${c}" stroke-width="2" points="${pts.map(p=>p.join(',')).join(' ')}"/>`;pts.forEach(p=>s+=`<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="${c}"/>`)});
 return s+'</svg><div class="legend">'+series.map(se=>`<span><i style="background:${scol(se.name)}"></i>${esc(subN(se.name))}</span>`).join('')+'</div>';
}
function trendH(labels,series){
 if(!series.length)return '';
 let h=`<div style="overflow-x:auto"><table class="xt"><tr><th>${T('Subject','பாடம்')}</th>${labels.map(l=>`<th>${esc(l)}</th>`).join('')}</tr>`;
 series.forEach(se=>{let prev=null;h+=`<tr><td>${esc(subN(se.name))}</td>`;se.pts.forEach(v=>{if(v==null){h+='<td>–</td>';return}let a='';if(prev!=null)a=v>prev+0.4?' <span style="color:#1B8F1E">▲</span>':v<prev-0.4?' <span style="color:#d64545">▼</span>':' =';h+=`<td>${rnd(v)}%${a}</td>`;prev=v});h+='</tr>'});
 return h+'</table></div>';
}
function autoNote(s,P,pm){
 const nm=s.name,Ls=a=>a.map(x=>subN(x.sub)).join(', ');
 if(!P.subs.length)return T(`No test marks have been entered for ${nm} in this period yet.`,`இந்தக் காலத்தில் ${nm} அவர்களுக்கு தேர்வு மதிப்பெண்கள் இன்னும் பதிவாகவில்லை.`);
 const st=P.subs.filter(x=>x.avg>=75),ok=P.subs.filter(x=>x.avg>=50&&x.avg<75),wk=P.subs.filter(x=>x.avg<50),out=[];
 out.push(T(`Based on the marks, ${nm} has an average of ${rnd(P.overall)}%.`,`மதிப்பெண்களின் அடிப்படையில் ${nm} அவர்களின் சராசரி ${rnd(P.overall)}%.`));
 if(st.length)out.push(T(`Doing very well in ${Ls(st)} (75% or more).`,`${Ls(st)} பாடங்களில் மிகச் சிறப்பாக உள்ளார் (75% அல்லது அதற்கு மேல்).`));
 if(ok.length)out.push(T(`Satisfactory in ${Ls(ok)}; a little more practice will lift these.`,`${Ls(ok)} பாடங்களில் திருப்தியான நிலை; சிறிது கூடுதல் பயிற்சி மேம்படுத்தும்.`));
 if(wk.length)out.push(T(`Needs special attention in ${Ls(wk)} (below 50%).`,`${Ls(wk)} பாடங்களில் சிறப்புக் கவனம் தேவை (50%க்குக் கீழ்).`));
 let tr=null;

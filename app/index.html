function msg(t,ok){const e=$('m');if(e)e.innerHTML=t?`<div class="msg ${ok?'okm':'err'}">${esc(t)}</div>`:''}
function errText(e){const c=(e&&e.code)||'';
 if(c.includes('invalid-credential')||c.includes('wrong-password')||c.includes('user-not-found'))return T('Wrong mobile number or PIN.','மொபைல் எண் அல்லது PIN தவறு.');
 if(c.includes('too-many-requests'))return T('Too many attempts. Wait a few minutes and try again.','பலமுறை முயன்றுவிட்டீர்கள். சில நிமிடம் காத்திருந்து மீண்டும் முயலவும்.');
 if(c.includes('network'))return T('No internet connection.','இணைய இணைப்பு இல்லை.');
 if(c.includes('email-already-in-use'))return T('This mobile number already has an account.','இந்த எண்ணுக்கு ஏற்கெனவே கணக்கு உள்ளது.');
 if(c.includes('permission-denied'))return T('Not allowed (permission denied).','அனுமதி இல்லை.');
 return T('Error: ','பிழை: ')+(c||e&&e.message||'');}

async function doLogin(){
 if(busy)return;const ph=$('ph').value.trim(),pn=$('pn').value.trim();
 if(!okPhone(ph))return msg(T('Enter a valid 10-digit mobile number.','சரியான 10 இலக்க மொபைல் எண்ணை உள்ளிடவும்.'));
 if(!okPin(pn))return msg(T('PIN must be 4 to 6 digits.','PIN 4 முதல் 6 இலக்கம் இருக்க வேண்டும்.'));
 busy=true;$('go').disabled=true;msg('');
 try{
  // try newest account first (after PIN resets the email gets a .vN suffix)
  let cred=null,last=null;
  for(const v of [1,2,3]){
   try{cred=await signInWithEmailAndPassword(auth,mail(ph,v),pass(pn));break}catch(e){last=e;if(!(e.code||'').includes('invalid-credential')&&!(e.code||'').includes('user-not-found'))break}
  }
  if(!cred)throw last;
 }catch(e){msg(errText(e));busy=false;$('go').disabled=false;return}
 busy=false;ME=null;route();
}

 <label>${T('Repeat PIN','PIN மீண்டும்')}</label><input id="pn2" type="password" inputmode="numeric" maxlength="6">

 $('go').onclick=async()=>{
  const a=$('pn').value.trim(),b=$('pn2').value.trim();
  if(!/^\d{6}$/.test(a))return msg(T('Owner PIN must be exactly 6 digits.','உரிமையாளர் PIN சரியாக 6 இலக்கம்.'));
  if(a!==b)return msg(T('The two PINs do not match.','இரு PIN-களும் பொருந்தவில்லை.'));
  if(await ownerExists()!==false)return msg(T('Owner already exists.','உரிமையாளர் ஏற்கெனவே உள்ளார்.'));
  $('go').disabled=true;busy=true;
  try{
   const c=await createUserWithEmailAndPassword(auth,mail(OWNER_PHONE,1),pass(a));
   const b2=writeBatch(fs);
   b2.set(doc(fs,'meta','owner'),{uid:c.user.uid,at:serverTimestamp()});
   b2.set(doc(fs,'users',c.user.uid),{role:'owner',name:'C. Manimegalai',phone:OWNER_PHONE,active:true,v:1,at:serverTimestamp()});
   await b2.commit();
  }catch(e){msg(errText(e));$('go').disabled=false;busy=false;return}
  busy=false;ME=null;route();
 };

function payCalc(t,m){
 const sal=SAL[t.uid]||0,wd=wdays(m),up=mEnd(m)<today()?mEnd(m):today(),past=wd.filter(d=>d<=up);
 const pres=new Set(SATM.filter(x=>x.uid===t.uid&&x.date.startsWith(m)).map(x=>x.date));
 const lvd={};LV.filter(l=>l.uid===t.uid&&l.status==='approved'&&l.date.startsWith(m)).forEach(l=>lvd[l.date]=l.type);
 const present=past.filter(d=>pres.has(d)).length;
 const pl=past.filter(d=>!pres.has(d)&&lvd[d]==='paid').length,ul=past.filter(d=>!pres.has(d)&&lvd[d]==='unpaid').length;
 const ua=past.filter(d=>!pres.has(d)&&!lvd[d]).length;

 const daily=div?sal/div:0,dedU=Math.round(daily*ul),dedA=Math.round(daily*ua),ded=Math.min(sal,dedU+dedA);

}
